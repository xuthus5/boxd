openapi: 3.1.0
info:
  title: boxd Control Plane API
  version: 0.1.0-dev
  description: |
    Same-origin REST and Server-Sent Events API for the boxd control plane.

    Browser clients authenticate with the `boxd_session` HttpOnly cookie. API
    clients may use the bearer token returned by initialization or login.
    Cookie-authenticated mutating requests must be same-origin.

    Error responses use a stable envelope with `code`, `op`, `message`, and an
    optional `hint`. Sensitive node options and subscription query values are
    omitted from list views.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: Same-origin boxd server
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: System
  - name: Authentication
  - name: Kernel
  - name: Configuration
  - name: Inbounds
  - name: Egress
  - name: Routing
  - name: DNS
  - name: Subscriptions
  - name: Rule sets
  - name: Observability
  - name: Settings
paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: health
      summary: Liveness and readiness summary
      security: []
      responses:
        '200':
          description: Service is accepting requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/auth/status:
    get:
      tags: [Authentication]
      operationId: authStatus
      summary: Inspect initialization and current session state
      security: []
      responses:
        '200':
          description: Authentication state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /api/v1/auth/initialize:
    post:
      tags: [Authentication]
      operationId: initializeAdministrator
      summary: Initialize the local administrator password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '201':
          description: Administrator created and session established.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate with the local administrator password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '200':
          description: Authenticated session.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current session
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: { type: boolean, const: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/snapshot:
    get:
      tags: [System, Configuration]
      operationId: getSnapshot
      summary: Get a consistent first-paint control-plane snapshot
      responses:
        '200':
          description: Full console snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/capabilities:
    get:
      tags: [System, Kernel]
      operationId: getCapabilities
      summary: Get engine kind, version, and capabilities
      responses:
        '200':
          description: Engine capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/scheduler:
    get:
      tags: [Subscriptions, System]
      operationId: getSchedulerStatus
      summary: Get subscription scheduler status
      responses:
        '200':
          description: Scheduler status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/config/history:
    get:
      tags: [Configuration]
      operationId: getConfigHistory
      summary: List recent desired-state revisions
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: Configuration history.
          content:
            application/json:
              schema:
                type: object
                required: [history, at]
                properties:
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/JsonObject' }
                  at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/kernel/status:
    get:
      tags: [Kernel]
      operationId: getKernelStatus
      summary: Get kernel runtime status
      responses:
        '200':
          description: Kernel status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KernelStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/kernel/start:
    post:
      tags: [Kernel]
      operationId: startKernel
      summary: Start the sing-box kernel
      responses:
        '200':
          description: Updated kernel status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KernelStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ApplyFailed' }
  /api/v1/kernel/stop:
    post:
      tags: [Kernel]
      operationId: stopKernel
      summary: Stop the sing-box kernel
      responses:
        '200':
          description: Updated kernel status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KernelStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/kernel/restart:
    post:
      tags: [Kernel]
      operationId: restartKernel
      summary: Restart the sing-box kernel
      responses:
        '200':
          description: Updated kernel status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KernelStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ApplyFailed' }
  /api/v1/inbounds:
    get:
      tags: [Inbounds]
      operationId: listInbounds
      summary: List managed inbounds
      responses:
        '200':
          description: Inbounds.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InboundView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Inbounds]
      operationId: createInbound
      summary: Create or save an inbound
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundInput' }
      responses:
        '201':
          description: Inbound created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/inbounds/{id}:
    parameters:
      - $ref: '#/components/parameters/InboundID'
    get:
      tags: [Inbounds]
      operationId: getInbound
      summary: Get one inbound
      responses:
        '200':
          description: Inbound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Inbounds]
      operationId: patchInbound
      summary: Update mutable inbound fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundPatch' }
      responses:
        '200':
          description: Updated inbound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Inbounds]
      operationId: deleteInbound
      summary: Delete an inbound
      responses:
        '200':
          description: Deleted identifier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/egress:
    get:
      tags: [Egress]
      operationId: getEgressCatalog
      summary: Get nodes, groups, and chains in one catalog
      responses:
        '200':
          description: Egress catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EgressCatalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/nodes:
    get:
      tags: [Egress]
      operationId: listNodes
      summary: List proxy nodes with redacted protocol options
      parameters:
        - name: subscription_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Nodes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NodeView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    get:
      tags: [Egress]
      operationId: getNode
      summary: Get full node data for editing
      responses:
        '200':
          description: Node including protocol options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Egress]
      operationId: updateNode
      summary: Replace editable node data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Node' }
      responses:
        '200':
          description: Updated node view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Egress]
      operationId: deleteNode
      summary: Delete a node
      responses:
        '200':
          description: Deleted identifier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/nodes/import-links:
    post:
      tags: [Egress]
      operationId: importNodeLinks
      summary: Import share links
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [links]
              properties:
                links:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string }
                group_id: { type: string }
      responses:
        '200':
          description: Import result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/nodes/import:
    post:
      tags: [Egress]
      operationId: importNodes
      summary: Import structured node records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodes]
              properties:
                nodes:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/Node' }
      responses:
        '200':
          description: Import result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/nodes/decode:
    post:
      tags: [Egress]
      operationId: decodeNodeLink
      summary: Decode one share link without importing it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link: { type: string }
      responses:
        '200':
          description: Decoded node preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/nodes/save:
    post:
      tags: [Egress]
      operationId: saveNode
      summary: Create or update a structured node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Node' }
      responses:
        '200':
          description: Saved node view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/nodes/test:
    post:
      tags: [Egress]
      operationId: testNodes
      summary: Run URL Test, TCP Ping, or ICMP Ping
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeTestRequest' }
      responses:
        '200':
          description: Batch test results. Individual failures are reported per node.
          content:
            application/json:
              schema:
                type: object
                required: [kind, results]
                properties:
                  kind: { type: string, enum: [url, tcp, icmp] }
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/NodeTestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/nodes/{id}/delay:
    parameters:
      - $ref: '#/components/parameters/NodeID'
    post:
      tags: [Egress]
      operationId: measureNodeDelay
      summary: Measure one node URL delay
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
      responses:
        '200':
          description: Delay result.
          content:
            application/json:
              schema:
                type: object
                required: [node_id, latency_ms, tested_at]
                properties:
                  node_id: { type: string }
                  url: { type: string }
                  latency_ms: { type: integer, format: int64, minimum: 0 }
                  tested_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/nodes/{id}/results:
    parameters:
      - $ref: '#/components/parameters/NodeID'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [Egress]
      operationId: listNodeTestResults
      summary: List persisted latency history for a node
      responses:
        '200':
          description: Test history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NodeTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/groups:
    get:
      tags: [Egress]
      operationId: listGroups
      summary: List strategy groups
      responses:
        '200':
          description: Groups.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Egress]
      operationId: saveGroup
      summary: Create or update a selector or URL-test group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupInput' }
      responses:
        '200':
          description: Saved group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/groups/{id}:
    parameters:
      - $ref: '#/components/parameters/GroupID'
    delete:
      tags: [Egress]
      operationId: deleteGroup
      summary: Delete a strategy group
      responses:
        '200':
          description: Deleted identifier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/groups/{id}/select:
    parameters:
      - $ref: '#/components/parameters/GroupID'
    post:
      tags: [Egress]
      operationId: selectGroupMember
      summary: Select the active member of a selector group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id]
              properties:
                node_id: { type: string }
      responses:
        '200':
          description: Updated groups.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/chains:
    get:
      tags: [Egress]
      operationId: listChains
      summary: List multi-hop proxy chains
      responses:
        '200':
          description: Chains.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChainView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Egress]
      operationId: saveChain
      summary: Create or update a chain with ordered hops
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChainInput' }
      responses:
        '200':
          description: Saved chain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChainView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/chains/{id}:
    parameters:
      - $ref: '#/components/parameters/ChainID'
    delete:
      tags: [Egress]
      operationId: deleteChain
      summary: Delete a proxy chain
      responses:
        '200':
          description: Deleted identifier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deleted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/routes:
    get:
      tags: [Routing]
      operationId: getRoutes
      summary: Get routing mode, default egress, presets, and ordered rules
      responses:
        '200':
          description: Routing profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/routes/mode:
    patch:
      tags: [Routing]
      operationId: setRouteMode
      summary: Set rules, global, or direct routing mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [rules, global, direct] }
      responses:
        '200':
          description: Updated routing profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/routes/default-egress:
    patch:
      tags: [Routing]
      operationId: setDefaultEgress
      summary: Set the default egress target
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EgressRef' }
      responses:
        '200':
          description: Updated routing profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/routes/presets:
    patch:
      tags: [Routing]
      operationId: setRoutePresets
      summary: Enable or disable built-in routing presets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutePresets' }
      responses:
        '200':
          description: Updated routing profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/routes/rules:
    post:
      tags: [Routing]
      operationId: saveRouteRule
      summary: Create or update one route rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRule' }
      responses:
        '200':
          description: Saved rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Routing]
      operationId: replaceRouteRules
      summary: Replace and reorder all route rules atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules:
                  type: array
                  items: { $ref: '#/components/schemas/RouteRule' }
      responses:
        '200':
          description: Replaced rules in evaluation order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RouteRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/routes/rules/{id}:
