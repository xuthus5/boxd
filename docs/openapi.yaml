  /api/v1/observability/logs:
    get:
      tags: [Observability]
      operationId: listLogs
      summary: Read recent application and kernel logs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: source
          in: query
          schema: { type: string, enum: [all, app, kernel], default: all }
      responses:
        '200':
          description: Log snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Logs' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/observability/traffic:
    get:
      tags: [Observability]
      operationId: getTraffic
      summary: Get current traffic counters and availability
      responses:
        '200':
          description: Traffic snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Traffic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/observability/connections:
    get:
      tags: [Observability]
      operationId: listConnections
      summary: List active connections
      responses:
        '200':
          description: Connections.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Observability]
      operationId: closeAllConnections
      summary: Close all active connections
      responses:
        '200':
          description: Number of connections closed.
          content:
            application/json:
              schema:
                type: object
                required: [closed]
                properties:
                  closed: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/observability/connections/{id}:
    parameters:
      - $ref: '#/components/parameters/ConnectionID'
    delete:
      tags: [Observability]
      operationId: closeConnection
      summary: Close one active connection by numeric ID
      responses:
        '200':
          description: Connection closed.
          content:
            application/json:
              schema:
                type: object
                required: [closed]
                properties:
                  closed: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/events:
    get:
      tags: [Observability, System]
      operationId: streamEvents
      summary: Subscribe to application logs, kernel logs, state, traffic, and invalidations
      description: |
        Server-Sent Events. Event names are `ready`, `app.log`, `kernel.log`,
        `kernel.state`, `traffic`, and `snapshot.invalidated`. A keepalive
        comment is emitted every 15 seconds. Reverse proxies must disable
        response buffering for this endpoint.
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: boxd_session
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    InboundID:
      name: id
      in: path
      required: true
      schema: { type: string }
    NodeID:
      name: id
      in: path
      required: true
      schema: { type: string }
    GroupID:
      name: id
      in: path
      required: true
      schema: { type: string }
    ChainID:
      name: id
      in: path
      required: true
      schema: { type: string }
    RuleID:
      name: id
      in: path
      required: true
      schema: { type: string }
    SubscriptionID:
      name: id
      in: path
      required: true
      schema: { type: string }
    RuleSetName:
      name: name
      in: path
      required: true
      schema: { type: string }
    SettingKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    ConnectionID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500 }
  responses:
    BadRequest:
      description: Invalid request or configuration.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Authentication is missing or expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: The operation conflicts with current state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many authentication attempts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ApplyFailed:
      description: The candidate configuration could not be applied.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    Health:
      type: object
      required: [service, status, version]
      properties:
        service: { type: string, example: boxd-web }
        status: { type: string, enum: [ok] }
        version: { type: string, example: v2 }
        started_at: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: kernel_unauthorized }
        op: { type: string, example: security.login }
        message: { type: string }
        hint: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }
    PasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 1024, format: password }
    Session:
      type: object
      required: [authenticated, token, expires_at, actor]
      properties:
        authenticated: { type: boolean, const: true }
        token: { type: string }
        expires_at: { type: string, format: date-time }
        actor: { type: string, example: web-admin }
    AuthStatus:
      type: object
      required: [initialized, authenticated, mode, session_count]
      properties:
        initialized: { type: boolean }
        authenticated: { type: boolean }
        mode: { type: string, enum: [local, password] }
        session_count: { type: integer, minimum: 0 }
        expires_at: { type: string, format: date-time }
        credential_updated_at: { type: string, format: date-time }
    SecurityStatus:
      type: object
      description: Safe subset of security state included in the control-plane snapshot.
      required: [initialized, mode, session_count]
      properties:
        initialized: { type: boolean }
        mode: { type: string, enum: [local, password] }
        session_count: { type: integer, minimum: 0 }
        credential_updated_at: { type: string, format: date-time }
    Capabilities:
      type: object
      required: [kind, version, items]
      properties:
        kind: { type: string, example: sing-box }
        version: { type: string, example: 1.14.4 }
        items: { $ref: '#/components/schemas/JsonObject' }
    KernelStatus:
      type: object
      required: [kind, state, version, revision, uptime_seconds]
      properties:
        kind: { type: string, example: sing-box }
        state: { type: string, enum: [stopped, starting, running, stopping, failed] }
        version: { type: string }
        started_at: { type: string, format: date-time }
        revision: { type: string }
        uptime_seconds: { type: integer, format: int64, minimum: 0 }
        last_error: { $ref: '#/components/schemas/Error' }
    SchedulerStatus:
      type: object
      required: [running, interval_seconds]
      properties:
        running: { type: boolean }
        interval_seconds: { type: integer, minimum: 0 }
        last_run_at: { type: string, format: date-time }
        next_run_at: { type: string, format: date-time }
        last_error: { type: string }
    Deleted:
      type: object
      required: [deleted]
      properties:
        deleted: { type: string }
    EgressRef:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [node, group, chain, direct, reject] }
        id: { type: string }
    ListenAddress:
      type: object
      required: [host, port]
      properties:
        host: { type: string, example: '::' }
        port: { type: integer, minimum: 1, maximum: 65535, example: 1080 }
    InboundAuth:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    TunOptions:
      type: object
      properties:
        interface_name: { type: string }
        addresses:
          type: array
          items: { type: string }
        mtu: { type: integer, minimum: 0 }
        stack: { type: string }
        auto_route: { type: boolean }
        strict_route: { type: boolean }
    InboundInput:
      type: object
      required: [name, kind, enabled]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        kind: { type: string, enum: [mixed, tun] }
        enabled: { type: boolean }
        listen: { $ref: '#/components/schemas/ListenAddress' }
        udp: { type: boolean }
        auth: { $ref: '#/components/schemas/InboundAuth' }
        egress: { $ref: '#/components/schemas/EgressRef' }
        tun: { $ref: '#/components/schemas/TunOptions' }
    InboundPatch:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        enabled: { type: boolean }
        listen: { $ref: '#/components/schemas/ListenAddress' }
        udp: { type: boolean }
    InboundView:
      type: object
      required: [id, name, kind, enabled, listen, udp, auth, connections, observed]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [mixed, tun] }
        enabled: { type: boolean }
        listen: { type: string, example: '[::]:1080' }
        udp: { type: boolean }
        auth: { type: boolean }
        mtu: { type: integer }
        stack: { type: string }
        connections: { type: integer }
        traffic: { type: string }
        rate: { type: string }
        observed: { type: boolean }
        bytes: { type: integer, format: int64 }
        rate_bytes: { type: integer, format: int64 }
    Node:
      type: object
      required: [name, protocol, server, port]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        protocol: { type: string, enum: [ss, vmess, vless, trojan, hysteria2, socks, http] }
        server: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        options:
          type: object
          additionalProperties: true
          description: Protocol-specific settings. Sensitive fields are returned only by the authenticated detail endpoint.
        supports_udp: { type: boolean, default: true }
        subscription_id: { type: string }
    NodeView:
      type: object
      required: [id, name, protocol, server, port, udp, groups, observed]
      properties:
        id: { type: string }
        name: { type: string }
        protocol: { type: string }
        server: { type: string }
        port: { type: integer }
        udp: { type: boolean }
        group: { type: string }
        groups:
          type: array
          items: { type: string }
        status: { type: string }
        traffic: { type: string }
        rate: { type: string }
        observed: { type: boolean }
        traffic_bytes: { type: integer, format: int64 }
        rate_bytes: { type: integer, format: int64 }
        subscription_id: { type: string }
    NodeImportResult:
      type: object
      required: [added, updated, nodes]
      properties:
        added: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeView' }
        group_warning: { type: string }
    NodeTestRequest:
      type: object
      required: [node_ids, kind]
      properties:
        node_ids:
          type: array
          minItems: 1
          items: { type: string }
        kind: { type: string, enum: [url, tcp, icmp] }
        url: { type: string, format: uri }
    NodeTestResult:
      type: object
      required: [node_id, kind, target, latency_ms, tested_at]
      properties:
        node_id: { type: string }
        node_name: { type: string }
        kind: { type: string, enum: [url, tcp, icmp] }
        target: { type: string }
        latency_ms: { type: integer, format: int64, minimum: 0 }
        error: { type: string }
        tested_at: { type: string, format: date-time }
    GroupInput:
      type: object
      required: [name, kind, members]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 60 }
        kind: { type: string, enum: [selector, urltest] }
        members:
          type: array
          minItems: 1
          items: { type: string }
        selected: { type: string }
        url: { type: string, format: uri }
        interval_seconds: { type: integer, minimum: 0 }
    GroupView:
      type: object
      required: [id, name, kind, members, description, latency]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [selector, urltest] }
        selected: { type: string }
        members:
          type: array
          items: { type: string }
        description: { type: string }
        latency: { type: integer, minimum: 0 }
        url: { type: string }
        interval_seconds: { type: integer }
    ProxyHop:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [node, group] }
        id: { type: string }
    ChainInput:
      type: object
      required: [name, hops]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 60 }
        hops:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: '#/components/schemas/ProxyHop' }
    ChainView:
      type: object
      required: [id, name, hops, usedBy, latency]
      properties:
        id: { type: string }
        name: { type: string }
        hops:
          type: array
          items: { type: string }
        description: { type: string }
        usedBy: { type: string }
        latency: { type: integer, minimum: 0 }
    PortRange:
      type: object
      required: [from, to]
      properties:
        from: { type: integer, minimum: 1, maximum: 65535 }
        to: { type: integer, minimum: 1, maximum: 65535 }
    RouteMatch:
      type: object
      properties:
        inbound_ids: { type: array, items: { type: string } }
        domains: { type: array, items: { type: string } }
        domain_suffixes: { type: array, items: { type: string } }
        domain_keywords: { type: array, items: { type: string } }
        ip_cidrs: { type: array, items: { type: string } }
        source_ip_cidrs: { type: array, items: { type: string } }
        process_names: { type: array, items: { type: string } }
        process_paths: { type: array, items: { type: string } }
        rule_sets: { type: array, items: { type: string } }
        networks: { type: array, items: { type: string, enum: [tcp, udp] } }
        ports: { type: array, items: { type: integer, minimum: 1, maximum: 65535 } }
        port_ranges: { type: array, items: { $ref: '#/components/schemas/PortRange' } }
        private_ip: { type: boolean }
        source_private_ip: { type: boolean }
    RouteRule:
      type: object
      required: [name, match, action]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 80 }
        disabled: { type: boolean }
        match: { $ref: '#/components/schemas/RouteMatch' }
        action: { type: string, enum: [egress, direct, reject] }
        egress: { $ref: '#/components/schemas/EgressRef' }
    RouteRulePatch:
      type: object
      properties:
        name: { type: string }
        disabled: { type: boolean }
        match: { $ref: '#/components/schemas/RouteMatch' }
        action: { type: string, enum: [egress, direct, reject] }
        egress: { $ref: '#/components/schemas/EgressRef' }
    RoutePresets:
      type: object
      required: [bypass_lan, china_direct, ad_block]
      properties:
        bypass_lan: { type: boolean }
        china_direct: { type: boolean }
        ad_block: { type: boolean }
    RouteView:
      type: object
      required: [mode, default_egress, default_target, presets, rules]
      properties:
        mode: { type: string, enum: [rules, global, direct] }
        default_egress: { $ref: '#/components/schemas/EgressRef' }
        default_target: { type: string }
        presets: { $ref: '#/components/schemas/RoutePresets' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/RouteRule' }
    SubscriptionInput:
      type: object
      required: [name, url, enabled]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 80 }
        url: { type: string, format: uri }
        interval_seconds: { type: integer, minimum: 0 }
        enabled: { type: boolean }
    SubscriptionPatch:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        url: { type: string, format: uri }
        interval_seconds: { type: integer, minimum: 0 }
        enabled: { type: boolean }
    SubscriptionView:
      type: object
      required: [id, name, provider, url, nodes, enabled, interval, lastRefresh, state]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        url: { type: string, description: Redacted display URL }
        nodes: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        interval: { type: integer, minimum: 0 }
        lastRefresh: { type: string }
        last_refreshed_at: { type: string, format: date-time }
        etag: { type: string }
        state: { type: string }
    SubscriptionRefreshResult:
      type: object
      required: [subscription, added, updated, removed, not_modified]
      properties:
        subscription: { $ref: '#/components/schemas/SubscriptionView' }
        added: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        not_modified: { type: boolean }
    RuleSetDefinition:
      type: object
      required: [name, url, format, enabled]
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        format: { type: string, enum: [binary, source] }
        enabled: { type: boolean }
    RuleSetView:
      type: object
      required: [name, url, format, enabled, builtin, size, updated, sha, status]
      properties:
        name: { type: string }
        url: { type: string }
        format: { type: string, enum: [binary, source] }
        enabled: { type: boolean }
        builtin: { type: boolean }
        description: { type: string }
        size: { type: string }
        updated: { type: string }
        updated_at: { type: string, format: date-time }
        sha: { type: string }
        status: { type: string }
        error: { type: string }
    DNSServerConfig:
      type: object
      required: [enabled, provider, protocol, address, detour, timeout_seconds]
      properties:
        enabled: { type: boolean }
        provider: { type: string, enum: [alidns, tencent, cloudflare, google, quad9, custom] }
        protocol: { type: string, enum: [udp, doh, dot] }
        address: { type: string }
        detour: { type: string, enum: [direct, route_default, egress] }
        egress: { $ref: '#/components/schemas/EgressRef' }
        timeout_seconds: { type: integer, minimum: 0 }
        follow_foreign: { type: boolean }
    DNSProfileInput:
      type: object
      required: [domestic, foreign, default, strategy, cache]
      properties:
        domestic: { $ref: '#/components/schemas/DNSServerConfig' }
        foreign: { $ref: '#/components/schemas/DNSServerConfig' }
        default: { $ref: '#/components/schemas/DNSServerConfig' }
        strategy: { type: string, example: prefer_ipv4 }
        cache: { type: boolean }
    DNSPatch:
      type: object
      properties:
        strategy: { type: string }
        cache: { type: boolean }
        domestic: { $ref: '#/components/schemas/DNSServerConfig' }
        foreign: { $ref: '#/components/schemas/DNSServerConfig' }
        default: { $ref: '#/components/schemas/DNSServerConfig' }
    DNSSlotView:
      type: object
      required: [slot, key, enabled, provider, protocol, address, detour, latency]
      properties:
        slot: { type: string }
        key: { type: string }
        enabled: { type: boolean }
        provider: { type: string }
        protocol: { type: string }
        address: { type: string }
        detour: { type: string }
        latency: { type: integer, minimum: 0 }
        tested_at: { type: string, format: date-time }
        error: { type: string }
        skipped: { type: boolean }
        reason: { type: string }
    DNSProfileView:
      allOf:
        - $ref: '#/components/schemas/DNSProfileInput'
        - type: object
          required: [slots]
          properties:
            slots:
              type: array
              items: { $ref: '#/components/schemas/DNSSlotView' }
    SettingsMap:
      type: object
      additionalProperties: { type: string }
      example:
        autoRefresh: 'on'
        subscriptionMaxAttempts: '3'
        subscriptionConflictPolicy: keep_local
    Setting:
      type: object
      required: [Key, Value, UpdatedAt]
      properties:
        Key: { type: string }
        Value: { type: string }
        UpdatedAt: { type: string, format: date-time }
    LogEntry:
      type: object
      required: [id, time, level, source, message]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        source: { type: string }
        message: { type: string }
        fields: { type: object, additionalProperties: true }
    Logs:
      type: object
      required: [app, kernel]
      properties:
        app:
          type: array
          items: { $ref: '#/components/schemas/LogEntry' }
        kernel:
          type: array
          items: { $ref: '#/components/schemas/LogEntry' }
    Traffic:
      type: object
      required: [upload_total, download_total, upload_rate, download_rate, available, at]
      properties:
        upload_total: { type: integer, format: int64 }
        download_total: { type: integer, format: int64 }
        upload_rate: { type: integer, format: int64 }
        download_rate: { type: integer, format: int64 }
        available: { type: boolean }
        at: { type: string, format: date-time }
    Connection:
      type: object
      required: [id, numeric_id, target, inbound, network, source, outbound, rule, process, upload, download, duration]
      properties:
        id: { type: string }
        numeric_id: { type: integer, format: int64 }
        target: { type: string }
        inbound: { type: string }
        network: { type: string }
        source: { type: string }
        outbound: { type: string }
        rule: { type: string }
        process: { type: string }
        upload: { type: string }
        download: { type: string }
        duration: { type: string }
        upload_bytes: { type: integer, format: int64 }
        download_bytes: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
    EgressCatalog:
      type: object
      required: [nodes, groups, chains]
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeView' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/GroupView' }
        chains:
          type: array
          items: { $ref: '#/components/schemas/ChainView' }
    Snapshot:
      type: object
      required: [server_time, revision, kernel, capabilities, scheduler, security, inbounds, nodes, groups, chains, routes, dns, rulesets, subscriptions, settings, connections, traffic, logs, overview]
      properties:
        server_time: { type: string, format: date-time }
        revision: { type: string }
        kernel: { $ref: '#/components/schemas/KernelStatus' }
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        scheduler: { $ref: '#/components/schemas/SchedulerStatus' }
        security: { $ref: '#/components/schemas/SecurityStatus' }
        inbounds:
          type: array
          items: { $ref: '#/components/schemas/InboundView' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeView' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/GroupView' }
        chains:
          type: array
          items: { $ref: '#/components/schemas/ChainView' }
        routes: { $ref: '#/components/schemas/RouteView' }
        dns: { $ref: '#/components/schemas/DNSProfileView' }
        rulesets:
          type: array
          items: { $ref: '#/components/schemas/RuleSetView' }
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionView' }
        settings: { $ref: '#/components/schemas/SettingsMap' }
        connections:
          type: array
          items: { $ref: '#/components/schemas/Connection' }
        traffic: { $ref: '#/components/schemas/Traffic' }
        logs: { $ref: '#/components/schemas/Logs' }
        overview: { $ref: '#/components/schemas/JsonObject' }
