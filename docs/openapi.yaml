          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsMap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/settings/{key}:
    parameters:
