name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desktop-package:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix ui
      - name: Install Linux package tooling
        run: |
          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              status=$?
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                return "${status}"
              fi
              echo "command failed with ${status}; retrying ${attempt}/${max_attempts}" >&2
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry timeout 5m sudo apt-get update -o Acquire::Retries=5
          retry timeout 10m sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwebkitgtk-6.0-4 \
            rpm file libfuse2 fuse3 desktop-file-utils wget
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Prepare AppImage runtime
        run: |
          set -euo pipefail
          case "${{ matrix.goarch }}" in
            amd64) runtime_arch="x86_64" ;;
            arm64) runtime_arch="aarch64" ;;
            *) echo "unsupported AppImage arch: ${{ matrix.goarch }}" >&2; exit 1 ;;
          esac
          runtime_dir="${RUNNER_TEMP}/appimage-runtime"
          mkdir -p "${runtime_dir}"
          runtime_file="${runtime_dir}/runtime-${runtime_arch}"
          curl --fail --silent --show-error --location \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${runtime_arch}" \
            --output "${runtime_file}"
          chmod 0755 "${runtime_file}"
          echo "LDAI_RUNTIME_FILE=${runtime_file}" >> "${GITHUB_ENV}"
      - name: Desktop module quality gate
        run: ./scripts/check-desktop.sh
      - name: Package desktop app (${{ matrix.arch }})
        env:
          GOPROXY: https://proxy.golang.org,https://goproxy.io,direct
          GOARCH: ${{ matrix.goarch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: ./scripts/package-desktop.sh "${GITHUB_REF_NAME}" "${{ matrix.goarch }}"
      - name: Stage desktop artifacts (${{ matrix.arch }})
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-dist"
          cp desktop/bin/boxd-desktop "$RUNNER_TEMP/desktop-dist/boxd-desktop-linux-${{ matrix.arch }}"
          cp desktop/bin/boxd-desktop.deb "$RUNNER_TEMP/desktop-dist/boxd-desktop-linux-${{ matrix.arch }}.deb"
          cp desktop/bin/boxd-desktop.rpm "$RUNNER_TEMP/desktop-dist/boxd-desktop-linux-${{ matrix.arch }}.rpm"
          appimage=$(find desktop/bin -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.appimage' \) | head -1)
          if [[ -n "$appimage" ]]; then
            cp "$appimage" "$RUNNER_TEMP/desktop-dist/boxd-desktop-linux-${{ matrix.arch }}.AppImage"
          fi
          cp desktop/build/linux/boxd-desktop.desktop "$RUNNER_TEMP/desktop-dist/boxd-desktop-linux-${{ matrix.arch }}.desktop"
      - name: Upload desktop artifacts (${{ matrix.arch }})
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/desktop-dist/*

  package-cross:
    runs-on: ${{ matrix.runner }}
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2022
          - os: darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Package headless ${{ matrix.os }} amd64/arm64
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,https://goproxy.io,direct
        run: ./scripts/package-cross.sh "${GITHUB_REF_NAME}" release ${{ matrix.os }} amd64 arm64
      - name: Publish headless ${{ matrix.os }} binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/boxd_${{ github.ref_name }}_${{ matrix.os }}_amd64.tar.gz
            release/boxd_${{ github.ref_name }}_${{ matrix.os }}_amd64.tar.gz.sha256
            release/boxd_${{ github.ref_name }}_${{ matrix.os }}_arm64.tar.gz
            release/boxd_${{ github.ref_name }}_${{ matrix.os }}_arm64.tar.gz.sha256

  desktop-cross:
    runs-on: ${{ matrix.runner }}
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-2022
          - os: macos
            arch: arm64
            runner: macos-14
          - os: macos
            arch: amd64
            runner: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Package desktop app (${{ matrix.os }} ${{ matrix.arch }})
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,https://goproxy.io,direct
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows" ]; then
            ./scripts/package-desktop-windows.sh "${GITHUB_REF_NAME}" "${{ matrix.arch }}"
          else
            ./scripts/package-desktop-macos.sh "${GITHUB_REF_NAME}" "${{ matrix.arch }}"
          fi
      - name: Publish desktop ${{ matrix.os }} artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(desktop/bin/boxd-desktop* boxd-desktop-*.zip)
          for f in boxd-desktop-*.dmg; do
            [ -e "$f" ] && assets+=("$f")
          done
          for asset in "${assets[@]}"; do
            echo "Uploading: $asset"
            gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber
          done

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies and tools
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 rpm file desktop-file-utils
          npm ci --prefix ui
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Run release quality gates
        run: |
          make check-go
          make check-ui
          make check-embedded-ui
          ./scripts/audit-ui.sh
      - name: Package Linux amd64/arm64 release
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}" release
      - name: Package headless deb/rpm/AppImage
        run: ./scripts/package-linux.sh "${GITHUB_REF_NAME}" amd64 arm64
      - name: Extract release binaries for SBOM
        run: |
          set -euo pipefail
          mkdir -p release/sbom/amd64 release/sbom/arm64
          tar -xzf "release/boxd_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C release/sbom/amd64
          tar -xzf "release/boxd_${GITHUB_REF_NAME}_linux_arm64.tar.gz" -C release/sbom/arm64
          install -m 0700 release/sbom/amd64/boxd release/sbom/boxd_linux_amd64
          install -m 0700 release/sbom/arm64/boxd release/sbom/boxd_linux_arm64
      - name: Generate SPDX SBOM (amd64)
        uses: anchore/sbom-action@v0
        with:
          path: release/sbom/boxd_linux_amd64
          format: spdx-json
          output-file: release/boxd_${{ github.ref_name }}_linux_amd64.spdx.json
          artifact-name: boxd-${{ github.ref_name }}-linux-amd64-sbom
      - name: Generate SPDX SBOM (arm64)
        uses: anchore/sbom-action@v0
        with:
          path: release/sbom/boxd_linux_arm64
          format: spdx-json
          output-file: release/boxd_${{ github.ref_name }}_linux_arm64.spdx.json
          artifact-name: boxd-${{ github.ref_name }}-linux-arm64-sbom
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/boxd_${{ github.ref_name }}_linux_amd64.tar.gz
            release/boxd_${{ github.ref_name }}_linux_amd64.tar.gz.sha256
            release/boxd_${{ github.ref_name }}_linux_amd64.spdx.json
            release/boxd_${{ github.ref_name }}_linux_arm64.tar.gz
            release/boxd_${{ github.ref_name }}_linux_arm64.tar.gz.sha256
            release/boxd_${{ github.ref_name }}_linux_arm64.spdx.json
            build/linux/bin/boxd_${{ github.ref_name }}_linux_amd64.deb
            build/linux/bin/boxd_${{ github.ref_name }}_linux_amd64.rpm
            build/linux/bin/boxd_${{ github.ref_name }}_linux_amd64.AppImage
            build/linux/bin/boxd_${{ github.ref_name }}_linux_arm64.deb
            build/linux/bin/boxd_${{ github.ref_name }}_linux_arm64.rpm
            build/linux/bin/boxd_${{ github.ref_name }}_linux_arm64.AppImage
      - name: Docker metadata
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME}"
          version_no_v="${version#v}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:${version}"
            echo "${image}:${version_no_v}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
