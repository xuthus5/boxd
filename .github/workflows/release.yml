name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desktop-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix ui
      - name: Install Linux package tooling
        run: |
          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              status=$?
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                return "${status}"
              fi
              echo "command failed with ${status}; retrying ${attempt}/${max_attempts}" >&2
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry timeout 5m sudo apt-get update -o Acquire::Retries=5
          retry timeout 10m sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwebkitgtk-6.0-4 \
            rpm file libfuse2 fuse3 desktop-file-utils wget
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Prepare AppImage runtime
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/appimage-runtime"
          mkdir -p "${runtime_dir}"
          runtime_file="${runtime_dir}/runtime-x86_64"
          curl --fail --silent --show-error --location \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" \
            --output "${runtime_file}"
          chmod 0755 "${runtime_file}"
          echo "LDAI_RUNTIME_FILE=${runtime_file}" >> "${GITHUB_ENV}"
      - name: Desktop module quality gate
        run: ./scripts/check-desktop.sh
      - name: Package desktop app
        env:
          GOPROXY: https://goproxy.io,direct
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: ./scripts/package-desktop.sh "${GITHUB_REF_NAME}"
      - name: Upload desktop artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/bin/boxd-desktop
            desktop/bin/boxd-desktop.deb
            desktop/bin/boxd-desktop.rpm
            desktop/bin/boxd-desktop-x86_64.AppImage
            desktop/build/linux/boxd-desktop.desktop

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies and tools
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 rpm file desktop-file-utils
          npm ci --prefix ui
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Run release quality gates
        run: |
          make check-go
          make check-ui
          make check-embedded-ui
          ./scripts/audit-ui.sh
      - name: Package Linux amd64/arm64 release
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}" release
      - name: Package headless deb/rpm/AppImage
        run: ./scripts/package-linux.sh "${GITHUB_REF_NAME}" amd64 arm64
      - name: Extract release binaries for SBOM
        run: |
          set -euo pipefail
          mkdir -p release/sbom/amd64 release/sbom/arm64
          tar -xzf "release/boxd_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C release/sbom/amd64
          tar -xzf "release/boxd_${GITHUB_REF_NAME}_linux_arm64.tar.gz" -C release/sbom/arm64
          install -m 0700 release/sbom/amd64/boxd release/sbom/boxd_linux_amd64
          install -m 0700 release/sbom/arm64/boxd release/sbom/boxd_linux_arm64
      - name: Generate SPDX SBOM (amd64)
        uses: anchore/sbom-action@v0
        with:
          path: release/sbom/boxd_linux_amd64
          format: spdx-json
          output-file: release/boxd_${{ github.ref_name }}_linux_amd64.spdx.json
          artifact-name: boxd-${{ github.ref_name }}-linux-amd64-sbom
      - name: Generate SPDX SBOM (arm64)
        uses: anchore/sbom-action@v0
        with:
          path: release/sbom/boxd_linux_arm64
          format: spdx-json
          output-file: release/boxd_${{ github.ref_name }}_linux_arm64.spdx.json
          artifact-name: boxd-${{ github.ref_name }}-linux-arm64-sbom
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/boxd_${{ github.ref_name }}_linux_amd64.tar.gz
            release/boxd_${{ github.ref_name }}_linux_amd64.tar.gz.sha256
            release/boxd_${{ github.ref_name }}_linux_amd64.spdx.json
            release/boxd_${{ github.ref_name }}_linux_arm64.tar.gz
            release/boxd_${{ github.ref_name }}_linux_arm64.tar.gz.sha256
            release/boxd_${{ github.ref_name }}_linux_arm64.spdx.json
            build/linux/bin/boxd_${{ github.ref_name }}_linux_amd64.deb
            build/linux/bin/boxd_${{ github.ref_name }}_linux_amd64.rpm
            build/linux/bin/boxd_${{ github.ref_name }}_linux_amd64.AppImage
            build/linux/bin/boxd_${{ github.ref_name }}_linux_arm64.deb
            build/linux/bin/boxd_${{ github.ref_name }}_linux_arm64.rpm
      - name: Docker metadata
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME}"
          version_no_v="${version#v}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:${version}"
            echo "${image}:${version_no_v}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
