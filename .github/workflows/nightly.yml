name: nightly

on:
  push:
    branches: [main]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix ui
      - name: Install Linux package tooling
        run: |
          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              status=$?
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                return "${status}"
              fi
              echo "command failed with ${status}; retrying ${attempt}/${max_attempts}" >&2
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry timeout 5m sudo apt-get update -o Acquire::Retries=5
          retry timeout 10m sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            rpm file desktop-file-utils
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2
      - name: Package Linux amd64/arm64 nightly
        run: ./scripts/package-release.sh nightly release
      - name: Package headless deb/rpm/AppImage
        run: ./scripts/package-linux.sh nightly amd64 arm64
      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boxd-nightly-linux
          path: |
            release/boxd_nightly_linux_amd64.tar.gz
            release/boxd_nightly_linux_amd64.tar.gz.sha256
            release/boxd_nightly_linux_arm64.tar.gz
            release/boxd_nightly_linux_arm64.tar.gz.sha256
            build/linux/bin/boxd_nightly_linux_amd64.deb
            build/linux/bin/boxd_nightly_linux_amd64.rpm
            build/linux/bin/boxd_nightly_linux_amd64.AppImage
            build/linux/bin/boxd_nightly_linux_arm64.deb
            build/linux/bin/boxd_nightly_linux_arm64.rpm
            build/linux/bin/boxd_nightly_linux_arm64.AppImage
          if-no-files-found: error
          retention-days: 14
      - name: Recreate nightly GitHub Release with notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/update-nightly-release.sh "${{ github.repository }}" "${{ github.sha }}" "${{ github.sha }}"
      - name: Upload nightly Linux assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload nightly \
            release/boxd_nightly_linux_amd64.tar.gz \
            release/boxd_nightly_linux_amd64.tar.gz.sha256 \
            release/boxd_nightly_linux_arm64.tar.gz \
            release/boxd_nightly_linux_arm64.tar.gz.sha256 \
            build/linux/bin/boxd_nightly_linux_amd64.deb \
            build/linux/bin/boxd_nightly_linux_amd64.rpm \
            build/linux/bin/boxd_nightly_linux_amd64.AppImage \
            build/linux/bin/boxd_nightly_linux_arm64.deb \
            build/linux/bin/boxd_nightly_linux_arm64.rpm \
            build/linux/bin/boxd_nightly_linux_arm64.AppImage \
            --clobber

  package-cross:
    runs-on: ${{ matrix.runner }}
    needs: package
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2022
          - os: darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Package headless ${{ matrix.os }} amd64/arm64
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,https://goproxy.io,direct
        run: ./scripts/package-cross.sh nightly release ${{ matrix.os }} amd64 arm64
      - name: Upload headless ${{ matrix.os }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boxd-nightly-${{ matrix.os }}
          path: |
            release/boxd_nightly_${{ matrix.os }}_amd64.tar.gz
            release/boxd_nightly_${{ matrix.os }}_amd64.tar.gz.sha256
            release/boxd_nightly_${{ matrix.os }}_arm64.tar.gz
            release/boxd_nightly_${{ matrix.os }}_arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Update rolling nightly GitHub Release (${{ matrix.os }})
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload nightly \
            release/boxd_nightly_${{ matrix.os }}_amd64.tar.gz \
            release/boxd_nightly_${{ matrix.os }}_amd64.tar.gz.sha256 \
            release/boxd_nightly_${{ matrix.os }}_arm64.tar.gz \
            release/boxd_nightly_${{ matrix.os }}_arm64.tar.gz.sha256 \
            --clobber

  desktop:
    runs-on: ${{ matrix.runner }}
    needs: package
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix ui
      - name: Install Linux package tooling
        run: |
          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              status=$?
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                return "${status}"
              fi
              echo "command failed with ${status}; retrying ${attempt}/${max_attempts}" >&2
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry timeout 5m sudo apt-get update -o Acquire::Retries=5
          retry timeout 10m sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwebkitgtk-6.0-4 \
            rpm file libfuse2 fuse3 desktop-file-utils wget
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2
      - name: Prepare AppImage runtime
        run: |
          set -euo pipefail
          case "${{ matrix.goarch }}" in
            amd64) runtime_arch="x86_64" ;;
            arm64) runtime_arch="aarch64" ;;
            *) echo "unsupported AppImage arch: ${{ matrix.goarch }}" >&2; exit 1 ;;
          esac
          runtime_dir="${RUNNER_TEMP}/appimage-runtime"
          mkdir -p "${runtime_dir}"
          runtime_file="${runtime_dir}/runtime-${runtime_arch}"
          curl --fail --silent --show-error --location \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${runtime_arch}" \
            --output "${runtime_file}"
          chmod 0755 "${runtime_file}"
          echo "LDAI_RUNTIME_FILE=${runtime_file}" >> "${GITHUB_ENV}"
      - name: Package desktop app (${{ matrix.arch }})
        env:
          GOPROXY: https://proxy.golang.org,https://goproxy.io,direct
          GOARCH: ${{ matrix.goarch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: ./scripts/package-desktop.sh nightly "${{ matrix.goarch }}"
      - name: Upload desktop artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: boxd-nightly-desktop-linux-${{ matrix.arch }}
          path: |
            desktop/bin/boxd-desktop
            desktop/bin/*.deb
            desktop/bin/*.rpm
            desktop/bin/*.AppImage
            desktop/build/linux/boxd-desktop.desktop
          if-no-files-found: error
          retention-days: 14
      - name: Stage artifacts per arch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-dist"
          cp desktop/bin/boxd-desktop "$RUNNER_TEMP/desktop-dist/boxd-desktop-linux-${{ matrix.arch }}"
          cp desktop/bin/boxd-desktop.deb "$RUNNER_TEMP/desktop-dist/boxd-desktop-linux-${{ matrix.arch }}.deb"
          cp desktop/bin/boxd-desktop.rpm "$RUNNER_TEMP/desktop-dist/boxd-desktop-linux-${{ matrix.arch }}.rpm"
          # AppImage 命名随 wails3/架构变化，通配符匹配。
          appimage=$(find desktop/bin -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.appimage' \) | head -1)
          if [[ -n "$appimage" ]]; then
            cp "$appimage" "$RUNNER_TEMP/desktop-dist/boxd-desktop-linux-${{ matrix.arch }}.AppImage"
          fi
          cp desktop/build/linux/boxd-desktop.desktop "$RUNNER_TEMP/desktop-dist/boxd-desktop-linux-${{ matrix.arch }}.desktop"
      - name: Update rolling nightly GitHub Release (desktop ${{ matrix.arch }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload nightly \
            "$RUNNER_TEMP/desktop-dist"/* \
            --clobber

  desktop-cross:
    runs-on: ${{ matrix.runner }}
    needs: package
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-2022
          - os: macos
            arch: arm64
            runner: macos-14
          - os: macos
            arch: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.2
      - name: Package desktop app (${{ matrix.os }} ${{ matrix.arch }})
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,https://goproxy.io,direct
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows" ]; then
            ./scripts/package-desktop-windows.sh nightly "${{ matrix.arch }}"
          else
            ./scripts/package-desktop-macos.sh nightly "${{ matrix.arch }}"
          fi
      - name: Upload desktop ${{ matrix.os }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boxd-nightly-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/bin/boxd-desktop*
            boxd-desktop-*.zip
            boxd-desktop-*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Update rolling nightly GitHub Release (desktop ${{ matrix.os }} ${{ matrix.arch }})
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows" ]; then
            assets=(desktop/bin/boxd-desktop.exe boxd-desktop-*.zip)
          else
            # macOS：仅发布 zip 与可选 dmg，避免上传无意义的裸二进制。
            assets=(boxd-desktop-*.zip)
            for f in boxd-desktop-*.dmg; do
              [ -e "$f" ] && assets+=("$f")
            done
          fi
          gh release upload nightly "${assets[@]}" --clobber

  finalize:
    runs-on: ubuntu-latest
    needs: [package, package-cross, desktop, desktop-cross]
    permissions:
      contents: write
    steps:
      - name: Publish nightly release after all assets uploaded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # draft 状态避免用户看到半成品资产；全部上传完成后统一发布。
          if gh release view nightly --draft --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit nightly --repo "${{ github.repository }}" --draft=false
            echo "nightly release published"
          else
            echo "nightly release not found in draft state; nothing to publish" >&2
            gh release view nightly --repo "${{ github.repository }}" --json id --jq .id || exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute image metadata
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:nightly" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=nightly
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max
