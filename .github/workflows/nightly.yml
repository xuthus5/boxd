name: nightly

on:
  push:
    branches: [main]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix ui
      - name: Install Linux package tooling
        run: |
          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              status=$?
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                return "${status}"
              fi
              echo "command failed with ${status}; retrying ${attempt}/${max_attempts}" >&2
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry timeout 5m sudo apt-get update -o Acquire::Retries=5
          retry timeout 10m sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            rpm file desktop-file-utils
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Package Linux amd64/arm64 nightly
        run: ./scripts/package-release.sh nightly release
      - name: Package headless deb/rpm/AppImage
        run: ./scripts/package-linux.sh nightly amd64 arm64
      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boxd-nightly-linux
          path: |
            release/boxd_nightly_linux_amd64.tar.gz
            release/boxd_nightly_linux_amd64.tar.gz.sha256
            release/boxd_nightly_linux_arm64.tar.gz
            release/boxd_nightly_linux_arm64.tar.gz.sha256
            build/linux/bin/boxd_nightly_linux_amd64.deb
            build/linux/bin/boxd_nightly_linux_amd64.rpm
            build/linux/bin/boxd_nightly_linux_amd64.AppImage
            build/linux/bin/boxd_nightly_linux_arm64.deb
            build/linux/bin/boxd_nightly_linux_arm64.rpm
          if-no-files-found: error
          retention-days: 14
      - name: Update rolling nightly GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="Rolling nightly build from \`main\`.

          - Commit: \`${{ github.sha }}\`
          - Built at: \`${{ github.event.head_commit.timestamp }}\`
          - Architectures: \`linux/amd64\`, \`linux/arm64\`

          This release always points at the latest successful \`main\` build.
          Asset names stay fixed as:
          - \`boxd_nightly_linux_amd64.tar.gz\`
          - \`boxd_nightly_linux_arm64.tar.gz\`"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title Nightly --prerelease --notes "$notes"
          else
            gh release create nightly \
              --title Nightly \
              --prerelease \
              --notes "$notes" \
              --target "${{ github.sha }}"
          fi
          gh release upload nightly \
            release/boxd_nightly_linux_amd64.tar.gz \
            release/boxd_nightly_linux_amd64.tar.gz.sha256 \
            release/boxd_nightly_linux_arm64.tar.gz \
            release/boxd_nightly_linux_arm64.tar.gz.sha256 \
            build/linux/bin/boxd_nightly_linux_amd64.deb \
            build/linux/bin/boxd_nightly_linux_amd64.rpm \
            build/linux/bin/boxd_nightly_linux_amd64.AppImage \
            build/linux/bin/boxd_nightly_linux_arm64.deb \
            build/linux/bin/boxd_nightly_linux_arm64.rpm \
            --clobber
          git tag -f nightly "${{ github.sha }}"
          git push -f origin refs/tags/nightly
      - name: Prune stale nightly assets
        if: ${{ !cancelled() && !failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 等待 release 资产列表最终一致。
          sleep 5
          # 从 release 主端点读取资产（稳定返回数组），过滤旧命名附件并删除。
          # 失败不阻断主流程（best-effort）。
          asset_ids=$(gh api "repos/${{ github.repository }}/releases/tags/nightly" \
            --jq '.assets[] | select(.name | test("^boxd_nightly-")) | .id' 2>/dev/null || true)
          if [ -n "$asset_ids" ]; then
            for asset_id in $asset_ids; do
              echo "Deleting stale asset $asset_id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id" || true
            done
          else
            echo "No stale assets to prune"
          fi

  desktop:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Linux package tooling
        run: |
          retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              status=$?
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                return "${status}"
              fi
              echo "command failed with ${status}; retrying ${attempt}/${max_attempts}" >&2
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          export DEBIAN_FRONTEND=noninteractive
          retry timeout 5m sudo apt-get update -o Acquire::Retries=5
          retry timeout 10m sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libwebkitgtk-6.0-4 \
            rpm file libfuse2 fuse3 desktop-file-utils wget
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
      - name: Prepare AppImage runtime
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/appimage-runtime"
          mkdir -p "${runtime_dir}"
          runtime_file="${runtime_dir}/runtime-x86_64"
          curl --fail --silent --show-error --location \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" \
            --output "${runtime_file}"
          chmod 0755 "${runtime_file}"
          echo "LDAI_RUNTIME_FILE=${runtime_file}" >> "${GITHUB_ENV}"
      - name: Package desktop app
        env:
          GOPROXY: https://goproxy.io,direct
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: ./scripts/package-desktop.sh nightly
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boxd-nightly-desktop-linux
          path: |
            desktop/bin/boxd-desktop
            desktop/bin/*.deb
            desktop/bin/*.rpm
            desktop/bin/*.AppImage
            desktop/build/linux/boxd-desktop.desktop
          if-no-files-found: error
          retention-days: 14
      - name: Update rolling nightly GitHub Release (desktop)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload nightly \
            desktop/bin/boxd-desktop \
            desktop/bin/*.deb \
            desktop/bin/*.rpm \
            desktop/bin/*.AppImage \
            desktop/build/linux/boxd-desktop.desktop \
            --clobber

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute image metadata
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:nightly" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=nightly
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max
