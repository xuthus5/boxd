name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Go quality tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run Go quality gate
        run: ./scripts/check-go.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Audit production dependencies
        run: ../scripts/audit-ui.sh
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ui/coverage

  embedded-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: ./scripts/check-embedded-ui.sh

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install GTK4 + WebKitGTK 6.0
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install wails3 and Go quality tools
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Desktop module quality gate
        run: ./scripts/check-desktop.sh
      - name: Build desktop binary
        working-directory: desktop
        run: |
          export GOPROXY=https://proxy.golang.org,https://goproxy.io,direct
          npm ci --prefix ../ui
          npm run build --prefix ../ui
          mkdir -p ui/dist
          cp -r ../ui/dist/* ui/dist/
          wails3 generate bindings -d ../ui/src/lib/api/bindings
          CGO_ENABLED=1 go build -tags "desktop embed_ui with_gvisor with_quic with_dhcp with_wireguard with_utls with_acme with_clash_api" -o /tmp/boxd-desktop ./
      - name: Verify desktop binary
        run: |
          test -x /tmp/boxd-desktop
          file /tmp/boxd-desktop

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: boxd:ci
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify entrypoint passthrough
        run: docker run --rm boxd:ci --version
      - name: Verify entrypoint init
        run: |
          docker run --rm --cap-add NET_RAW -d --name boxd-ci-smoke boxd:ci >/dev/null
          docker exec boxd-ci-smoke /bin/sh -c 'test -d /var/lib/boxd && test -d /etc/sing-box && echo INIT_OK'
          # boxd 进程（PID 1）应持有 CAP_NET_RAW（容器内非 POSIX 解码，直接匹配 CapEff 位）。
          cap_eff=$(docker exec boxd-ci-smoke /bin/sh -c 'grep CapEff /proc/1/status | awk "{print \$2}"')
          if [ -n "$cap_eff" ] && [ $((0x$cap_eff & 0x2000)) -ne 0 ]; then
            echo "PRIV_OK (net_raw bit set: $cap_eff)"
          else
            echo "PRIV_MISSING (cap_eff=$cap_eff)"
            exit 1
          fi
          docker rm -f boxd-ci-smoke >/dev/null
