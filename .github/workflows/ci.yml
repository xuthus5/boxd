name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    env:
      BUILD_TAGS: with_utls,with_quic
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required for:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run go vet
        run: go vet -tags "${BUILD_TAGS}" ./...

      - name: Run tests
        run: go test -tags "${BUILD_TAGS}" ./...

      - name: Run race detector
        run: go test -race -tags "${BUILD_TAGS}" ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Run Go vulnerability scan
        run: '"$(go env GOPATH)/bin/govulncheck" -tags "${BUILD_TAGS}" ./...'

  web:
    name: Web quality and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Run static quality checks
        run: npm run check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build boxd
        run: make build

      - name: Build native desktop for Linux, macOS and Windows
        run: make build-desktop-all

      - name: Verify binaries
        run: |
          set -euo pipefail
          ./bin/boxd -version
          ./bin/boxd-desktop -version
          file ./bin/boxd
          file dist/desktop/boxd-desktop-*

  scripts:
    name: Validate deployment scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck deploy/*.sh .github/scripts/*.sh e2e/*.sh
